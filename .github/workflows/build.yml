name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    # WPF only builds on Windows, so the Linux runners can't be used.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build MusicTool.sln

      # Hardware tests skip themselves here because MUSICTOOL_HARDWARE_TESTS isn't set.
      - name: Test
        run: dotnet test MusicTool.sln --no-build
